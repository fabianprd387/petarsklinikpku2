<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/L.Control.Locate.min.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <link rel="stylesheet" href="css/leaflet-measure.css">
    <link rel="stylesheet" href="css/leaflet-routing-machine.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background: #f4f7f6;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .sidebar-left {
            width: 280px;
            background: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 10000;
            position: relative;
            transition: margin-left 0.3s ease-in-out;
        }
        .sidebar-left.closed {
            margin-left: -280px;
        }
        .close-left-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 20px;
            color: #7f8c8d;
            cursor: pointer;
        }
        .close-left-btn:hover {
            color: #e74c3c;
        }
        .toggle-menu-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 9999;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
            font-size: 16px;
            color: #333;
            transition: all 0.3s;
        }
        .toggle-menu-btn:hover {
            background: #f4f4f4;
        }
        .sidebar-left h2 {
            margin-top: 0;
            font-size: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
            padding-right: 30px;
        }
        .menu-btn {
            background: #ffffff;
            color: #2c3e50;
            border: 1px solid #dcdde1;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn:hover {
            background: #f8f9fa;
            border-color: #3498db;
            color: #3498db;
        }
        .map-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .sidebar-right {
            width: 350px;
            background: #ffffff;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            right: -360px;
            height: 100%;
            transition: right 0.3s ease-in-out;
        }
        .sidebar-right.active {
            right: 0;
        }
        .info-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-header h3 {
            margin: 0;
            font-size: 16px;
            color: #2c3e50;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
            padding: 0;
            line-height: 1;
        }
        .info-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .info-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #eee;
        }
        .info-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin: 0 0 5px 0;
        }
        .info-type {
            font-size: 13px;
            color: #3498db;
            font-weight: 600;
            margin-bottom: 15px;
            display: inline-block;
            background: #e1f0fa;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .info-detail {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
            display: flex;
            gap: 10px;
        }
        .btn-rute {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-rute:hover { 
            background: #2980b9; 
        }
        /* Mendorong semua kontrol di kiri atas ke bawah agar tidak tertimpa tombol menu */
        .leaflet-top.leaflet-left {
            padding-top: 60px;
        }
    </style>
    <title></title>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar-left" id="sidebar-left">
            <button class="close-left-btn" onclick="toggleLeftSidebar()"><i class="fas fa-times"></i></button>
            <h2>Peta Medis</h2>
            <button class="menu-btn" onclick="resetLocation()">
                <i class="fas fa-crosshairs"></i> Kembali ke Lokasi Saya
            </button>
            <div style="margin-top: 20px;">
                <p style="font-size: 13px; color: #7f8c8d; font-weight: 600; text-transform: uppercase;">Informasi</p>
                <p style="font-size: 12px; color: #555; line-height: 1.6;">Klik pada ikon Rumah Sakit atau Klinik di peta untuk melihat detail informasi di panel kanan, lalu buat rute perjalanan.</p>
            </div>
        </nav>
        <main class="map-wrapper">
            <button class="toggle-menu-btn" onclick="toggleLeftSidebar()"><i class="fas fa-bars"></i></button>
            <div id="map"></div>
            <aside class="sidebar-right" id="info-panel">
                <div class="info-header">
                    <h3>Detail Lokasi</h3>
                    <button class="close-btn" onclick="closeSidebar()">&times;</button>
                </div>
                <div class="info-body" id="info-content">
                </div>
            </aside>
        </main>
    </div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/L.Control.Locate.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="js/leaflet-measure.js"></script>
    <script src="data/jalan_1.js"></script>
    <script src="data/Jalanutama_2.js"></script>
    <script src="data/AdministrasiPekanbaru_3.js"></script>
    <script src="data/Klinik_4.js"></script>
    <script src="data/RumahSakit_5.js"></script>
    <script src="js/leaflet-routing-machine.min.js"></script>
    <script>
        var highlightLayer;
        
        function highlightFeature(e) {
            highlightLayer = e.target;
            if (typeof highlightLayer.setStyle !== 'function') {
                highlightLayer.setOpacity(0.5);
                return;
            }
            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
                highlightLayer.setStyle({ color: 'rgba(255, 255, 0, 1.00)' });
            } else {
                highlightLayer.setStyle({ fillColor: 'rgba(0, 0, 255, 1.0)', fillOpacity: 0.2 });
            }
        }

        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        }).fitBounds([[0.407275398903317, 101.25808798159883], [0.5815611963601693, 101.60007778657837]]);
        
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });

        var routingControl = null;
        var userMarker = null;

        function toggleLeftSidebar() {
            var sidebar = document.getElementById('sidebar-left');
            sidebar.classList.toggle('closed');
            setTimeout(function() {
                map.invalidateSize();
            }, 300);
        }
        
        function ruteKe(lat, lng) {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            if (!navigator.geolocation) {
                alert("Browser Anda tidak mendukung geolocation.");
                return;
            }
            
            closeSidebar();
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    routingControl = L.Routing.control({
                        waypoints: [
                            L.latLng(position.coords.latitude, position.coords.longitude),
                            L.latLng(lat, lng)
                        ],
                        routeWhileDragging: false,
                        show: true,
                        collapsible: true
                    }).addTo(map);
                },
                function() {
                    alert("Gagal mendapatkan lokasi Anda. Pastikan izin lokasi diaktifkan.");
                }
            );
        }

        function resetLocation() {
            if (!navigator.geolocation) {
                alert("Browser Anda tidak mendukung geolocation.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    
                    map.flyTo([lat, lng], 15, {
                        animate: true,
                        duration: 1.5
                    });

                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }
                    
                    userMarker = L.marker([lat, lng]).addTo(map)
                        .bindPopup("<b>Lokasi Anda Saat Ini</b>")
                        .openPopup();
                },
                function() {
                    alert("Gagal mendapatkan lokasi. Pastikan izin lokasi diberikan.");
                }
            );
        }

        function openSidebarInfo(title, type, phone, address, lat, lng) {
            var panel = document.getElementById('info-panel');
            var content = document.getElementById('info-content');
            
            var imgSrc = 'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=500&q=80';
            if(type === 'Klinik') {
                imgSrc = 'https://images.unsplash.com/photo-1579684385127-1ef15d508118?w=500&q=80';
            }

            content.innerHTML = `
                <img src="${imgSrc}" class="info-image" alt="Gambar">
                <h2 class="info-title">${title}</h2>
                <span class="info-type">${type}</span>
                
                <div class="info-detail">
                    <i class="fas fa-phone-alt" style="margin-top:3px; color:#7f8c8d;"></i>
                    <span>${phone}</span>
                </div>
                <div class="info-detail">
                    <i class="fas fa-map-marker-alt" style="margin-top:3px; color:#e74c3c;"></i>
                    <span>${address}</span>
                </div>
                
                <button class="btn-rute" onclick="ruteKe(${lat}, ${lng})">
                    <i class="fas fa-directions"></i> Rute ke sini
                </button>
            `;
            
            panel.classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('info-panel').classList.remove('active');
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.locate({ position: 'topleft', locateOptions: { maxZoom: 19 } }).addTo(map);
        
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        
        var bounds_group = new L.featureGroup([]);
        function setBounds() {}
        
        map.createPane('pane_SatelitGoogle_0');
        map.getPane('pane_SatelitGoogle_0').style.zIndex = 400;
        var layer_SatelitGoogle_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_SatelitGoogle_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        map.addLayer(layer_SatelitGoogle_0);
        
        function pop_jalan_1(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
        }

        function style_jalan_1_0() {
            return {
                pane: 'pane_jalan_1', opacity: 1,
                color: 'rgba(226,226,226,0.5529411764705883)',
                dashArray: '', lineCap: 'square', lineJoin: 'bevel',
                weight: 1.0, fillOpacity: 0, interactive: true,
            }
        }
        map.createPane('pane_jalan_1');
        map.getPane('pane_jalan_1').style.zIndex = 401;
        map.getPane('pane_jalan_1').style['mix-blend-mode'] = 'normal';
        var layer_jalan_1 = new L.geoJson(json_jalan_1, {
            attribution: '', interactive: true,
            dataVar: 'json_jalan_1', layerName: 'layer_jalan_1',
            pane: 'pane_jalan_1', onEachFeature: pop_jalan_1, style: style_jalan_1_0,
        });
        bounds_group.addLayer(layer_jalan_1);
        map.addLayer(layer_jalan_1);
        
        function pop_Jalanutama_2(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
        }

        function style_Jalanutama_2_0() {
            return {
                pane: 'pane_Jalanutama_2', opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '', lineCap: 'square', lineJoin: 'bevel',
                weight: 2.0, fillOpacity: 0, interactive: true,
            }
        }
        map.createPane('pane_Jalanutama_2');
        map.getPane('pane_Jalanutama_2').style.zIndex = 402;
        map.getPane('pane_Jalanutama_2').style['mix-blend-mode'] = 'normal';
        var layer_Jalanutama_2 = new L.geoJson(json_Jalanutama_2, {
            attribution: '', interactive: true,
            dataVar: 'json_Jalanutama_2', layerName: 'layer_Jalanutama_2',
            pane: 'pane_Jalanutama_2', onEachFeature: pop_Jalanutama_2, style: style_Jalanutama_2_0,
        });
        bounds_group.addLayer(layer_Jalanutama_2);
        map.addLayer(layer_Jalanutama_2);
        
        function pop_AdministrasiPekanbaru_3(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var n = feature.properties['NAMOBJ'] !== null ? String(feature.properties['NAMOBJ']) : '';
            var k = feature.properties['WADMKC'] !== null ? String(feature.properties['WADMKC']) : '';
            layer.bindPopup('<div style="text-align:center; padding: 5px;"><strong style="font-size:1.1em;">' + n + '</strong><br><span style="color:#555;">Kecamatan: ' + k + '</span></div>', { maxHeight: 400 });
        }

        function style_AdministrasiPekanbaru_3_0() {
            return {
                pane: 'pane_AdministrasiPekanbaru_3', opacity: 1,
                color: 'rgba(3,175,235,1.0)',
                dashArray: '5.0,1.0', lineCap: 'butt', lineJoin: 'miter',
                weight: 1.0, fill: true, fillOpacity: 1,
                fillColor: 'rgba(152,125,183,0.0)', interactive: true,
            }
        }
        map.createPane('pane_AdministrasiPekanbaru_3');
        map.getPane('pane_AdministrasiPekanbaru_3').style.zIndex = 403;
        map.getPane('pane_AdministrasiPekanbaru_3').style['mix-blend-mode'] = 'normal';
        var layer_AdministrasiPekanbaru_3 = new L.geoJson(json_AdministrasiPekanbaru_3, {
            attribution: '', interactive: true,
            dataVar: 'json_AdministrasiPekanbaru_3', layerName: 'layer_AdministrasiPekanbaru_3',
            pane: 'pane_AdministrasiPekanbaru_3', onEachFeature: pop_AdministrasiPekanbaru_3, style: style_AdministrasiPekanbaru_3_0,
        });
        bounds_group.addLayer(layer_AdministrasiPekanbaru_3);
        map.addLayer(layer_AdministrasiPekanbaru_3);
        
        function pop_Klinik_4(feature, layer) {
            var title = feature.properties['Nama Klinik'] || '-';
            layer.bindPopup("<b>" + title + "</b>");
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
                click: function(e) {
                    L.DomEvent.stopPropagation(e);
                    var lat = feature.geometry.coordinates[1];
                    var lng = feature.geometry.coordinates[0];
                    var phone = feature.properties['No.telp'] || '-';
                    var address = feature.properties['Alamat'] || '-';
                    openSidebarInfo(title, 'Klinik', phone, address, lat, lng);
                }
            });
        }

        function style_Klinik_4_0() {
            return {
                pane: 'pane_Klinik_4',
                rotationAngle: 0.0, rotationOrigin: 'center center',
                icon: L.icon({ iconUrl: 'markers/Klinik_4.svg', iconSize: [20.52, 20.52] }),
                interactive: true,
            }
        }
        map.createPane('pane_Klinik_4');
        map.getPane('pane_Klinik_4').style.zIndex = 404;
        map.getPane('pane_Klinik_4').style['mix-blend-mode'] = 'normal';
        var layer_Klinik_4 = new L.geoJson(json_Klinik_4, {
            attribution: '', interactive: true,
            dataVar: 'json_Klinik_4', layerName: 'layer_Klinik_4',
            pane: 'pane_Klinik_4', onEachFeature: pop_Klinik_4,
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, style_Klinik_4_0(feature));
            },
        });
        bounds_group.addLayer(layer_Klinik_4);
        map.addLayer(layer_Klinik_4);
        
        function pop_RumahSakit_5(feature, layer) {
            var title = feature.properties['Nama Rumah Sakit'] || '-';
            layer.bindPopup("<b>" + title + "</b>");
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
                click: function(e) {
                    L.DomEvent.stopPropagation(e);
                    var lat = feature.geometry.coordinates[1];
                    var lng = feature.geometry.coordinates[0];
                    var phone = feature.properties['Kontak'] || '-';
                    var address = feature.properties['Alamat'] || '-';
                    var jenis = feature.properties['Jenis'] || 'Rumah Sakit';
                    openSidebarInfo(title, jenis, phone, address, lat, lng);
                }
            });
        }

        function style_RumahSakit_5_0() {
            return {
                pane: 'pane_RumahSakit_5',
                rotationAngle: 0.0, rotationOrigin: 'center center',
                icon: L.icon({ iconUrl: 'markers/RumahSakit_5.svg', iconSize: [14.44, 14.44] }),
                interactive: true,
            }
        }
        map.createPane('pane_RumahSakit_5');
        map.getPane('pane_RumahSakit_5').style.zIndex = 405;
        map.getPane('pane_RumahSakit_5').style['mix-blend-mode'] = 'normal';
        var layer_RumahSakit_5 = new L.geoJson(json_RumahSakit_5, {
            attribution: '', interactive: true,
            dataVar: 'json_RumahSakit_5', layerName: 'layer_RumahSakit_5',
            pane: 'pane_RumahSakit_5', onEachFeature: pop_RumahSakit_5,
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, style_RumahSakit_5_0(feature));
            },
        });
        bounds_group.addLayer(layer_RumahSakit_5);
        map.addLayer(layer_RumahSakit_5);
        
        var overlaysTree = [
            { label: '<img src="legend/RumahSakit_5.png" /> Rumah Sakit', layer: layer_RumahSakit_5 },
            { label: '<img src="legend/Klinik_4.png" /> Klinik', layer: layer_Klinik_4 },
            { label: '<img src="legend/AdministrasiPekanbaru_3.png" /> Administrasi Pekanbaru', layer: layer_AdministrasiPekanbaru_3 },
            { label: '<img src="legend/Jalanutama_2.png" /> Jalan-utama', layer: layer_Jalanutama_2 },
            { label: '<img src="legend/jalan_1.png" /> jalan', layer: layer_jalan_1 },
            { label: "Satelit Google", layer: layer_SatelitGoogle_0 },]
        
        // Pindahkan layer control ke kiri atas (di bawah tombol zoom)
        var lay = L.control.layers.tree(null, overlaysTree, {
            collapsed: true,
            position: 'topleft'
        });
        lay.addTo(map);
        setBounds();
        
    </script>
</body>
</html>
