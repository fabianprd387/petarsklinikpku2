<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">

        body,

        }

            background: #2563eb;

            padding: 7px 14px;

            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-size: 13px;
        }
        .btn-rute:hover { background: #1d4ed8; }

    <title></title>
</head>

<body>
    <div id="map">
    </div>
    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/L.Control.Locate.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="js/leaflet-measure.js"></script>
    <script src="data/jalan_1.js"></script>
    <script src="data/Jalanutama_2.js"></script>
    <script src="data/AdministrasiPekanbaru_3.js"></script>
    <script src="data/Klinik_4.js"></script>
    <script src="data/RumahSakit_5.js"></script>
    <script src="js/leaflet-routing-machine.min.js"></script>
    <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;
            if (typeof highlightLayer.setStyle !== 'function') {
                highlightLayer.setOpacity(0.5);
                return;
            }
            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
                highlightLayer.setStyle({
                    color: 'rgba(255, 255, 0, 1.00)',
                });
            } else {
                highlightLayer.setStyle({
                    fillColor: 'rgba(0, 0, 255, 1.0)',
                    fillOpacity: 0.2
                });
            }
        }
        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        }).fitBounds([[0.407275398903317, 101.25808798159883], [0.5815611963601693, 101.60007778657837]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });
        
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }
        
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function () {
                        popup.update();
                    });
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var routingControl = null;
        function ruteKe(lat, lng) {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            if (!navigator.geolocation) {
                alert("Browser Anda tidak mendukung geolocation.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    routingControl = L.Routing.control({
                        waypoints: [
                            L.latLng(position.coords.latitude, position.coords.longitude),
                            L.latLng(lat, lng)
                        ],
                        routeWhileDragging: false,
                        show: true,
                        collapsible: true
                    }).addTo(map);
                },
                function() {
                    alert("Gagal mendapatkan lokasi Anda. Pastikan izin lokasi diaktifkan.");
                }
            );
        }

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({ locateOptions: { maxZoom: 19 } }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        
        map.createPane('pane_SatelitGoogle_0');
        map.getPane('pane_SatelitGoogle_0').style.zIndex = 400;
        var layer_SatelitGoogle_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_SatelitGoogle_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_SatelitGoogle_0;
        map.addLayer(layer_SatelitGoogle_0);
        
        function pop_jalan_1(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['name'] !== null ? autolinker.link(String(feature.properties['name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_jalan_1_0() {
            return {
                pane: 'pane_jalan_1',
                opacity: 1,
                color: 'rgba(226,226,226,0.5529411764705883)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_jalan_1');
        map.getPane('pane_jalan_1').style.zIndex = 401;
        map.getPane('pane_jalan_1').style['mix-blend-mode'] = 'normal';
        var layer_jalan_1 = new L.geoJson(json_jalan_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_jalan_1',
            layerName: 'layer_jalan_1',
            pane: 'pane_jalan_1',
            onEachFeature: pop_jalan_1,
            style: style_jalan_1_0,
        });
        bounds_group.addLayer(layer_jalan_1);
        map.addLayer(layer_jalan_1);
        
        function pop_Jalanutama_2(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['NAMOBJ'] !== null ? autolinker.link(String(feature.properties['NAMOBJ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);

        function style_Jalanutama_2_0() {
            return {
                pane: 'pane_Jalanutama_2',
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Jalanutama_2');
        map.getPane('pane_Jalanutama_2').style.zIndex = 402;
        map.getPane('pane_Jalanutama_2').style['mix-blend-mode'] = 'normal';
        var layer_Jalanutama_2 = new L.geoJson(json_Jalanutama_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Jalanutama_2',
            layerName: 'layer_Jalanutama_2',
            pane: 'pane_Jalanutama_2',
            onEachFeature: pop_Jalanutama_2,
            style: style_Jalanutama_2_0,
        });
        bounds_group.addLayer(layer_Jalanutama_2);
        map.addLayer(layer_Jalanutama_2);
        
        function pop_AdministrasiPekanbaru_3(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<div style="text-align:center; padding: 5px;">\
                    <strong style="font-size:1.1em;">' + (feature.properties['NAMOBJ'] !== null ? autolinker.link(String(feature.properties['NAMOBJ']).replace(/'/g, '\'').toLocaleString()) : '') + '</strong><br>\
                    <span style="color:#555;">Kecamatan: ' + (feature.properties['WADMKC'] !== null ? autolinker.link(String(feature.properties['WADMKC']).replace(/'/g, '\'').toLocaleString()) : '') + '</span>\
                </div>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_AdministrasiPekanbaru_3_0() {
            return {
                pane: 'pane_AdministrasiPekanbaru_3',
                opacity: 1,
                color: 'rgba(3,175,235,1.0)',
                dashArray: '5.0,1.0',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(152,125,183,0.0)',
                interactive: true,
            }
        }
        map.createPane('pane_AdministrasiPekanbaru_3');
        map.getPane('pane_AdministrasiPekanbaru_3').style.zIndex = 403;
        map.getPane('pane_AdministrasiPekanbaru_3').style['mix-blend-mode'] = 'normal';
        var layer_AdministrasiPekanbaru_3 = new L.geoJson(json_AdministrasiPekanbaru_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_AdministrasiPekanbaru_3',
            layerName: 'layer_AdministrasiPekanbaru_3',
            pane: 'pane_AdministrasiPekanbaru_3',
            onEachFeature: pop_AdministrasiPekanbaru_3,
            style: style_AdministrasiPekanbaru_3_0,
        });
        bounds_group.addLayer(layer_AdministrasiPekanbaru_3);
        map.addLayer(layer_AdministrasiPekanbaru_3);
        
        function pop_Klinik_4(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><b>' + (feature.properties['Nama Klinik'] !== null ? autolinker.link(String(feature.properties['Nama Klinik']).replace(/'/g, '\'').toLocaleString()) : '') + '</b></td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">📞 ' + (feature.properties['No.telp'] !== null ? autolinker.link(String(feature.properties['No.telp']).replace(/'/g, '\'').toLocaleString()) : '-') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">📍 ' + (feature.properties['Alamat'] !== null ? autolinker.link(String(feature.properties['Alamat']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var lat = feature.properties['Y'] || feature.geometry.coordinates[1];
            var lng = feature.properties['X'] || feature.geometry.coordinates[0];
            popupContent += '<button class="btn-rute" onclick="ruteKe(' + lat + ',' + lng + ')">🗺️ Rute ke sini</button>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Klinik_4_0() {
            return {
                pane: 'pane_Klinik_4',
                rotationAngle: 0.0,
                rotationOrigin: 'center center',
                icon: L.icon({
                    iconUrl: 'markers/Klinik_4.svg',
                    iconSize: [20.52, 20.52]
                }),
                interactive: true,
            }
        }
        map.createPane('pane_Klinik_4');
        map.getPane('pane_Klinik_4').style.zIndex = 404;
        map.getPane('pane_Klinik_4').style['mix-blend-mode'] = 'normal';
        var layer_Klinik_4 = new L.geoJson(json_Klinik_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Klinik_4',
            layerName: 'layer_Klinik_4',
            pane: 'pane_Klinik_4',
            onEachFeature: pop_Klinik_4,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.marker(latlng, style_Klinik_4_0(feature));
            },
        });
        bounds_group.addLayer(layer_Klinik_4);
        map.addLayer(layer_Klinik_4);
        
        function pop_RumahSakit_5(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><b>' + (feature.properties['Nama Rumah Sakit'] !== null ? autolinker.link(String(feature.properties['Nama Rumah Sakit']).replace(/'/g, '\'').toLocaleString()) : '') + '</b></td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><i>' + (feature.properties['Jenis'] !== null ? autolinker.link(String(feature.properties['Jenis']).replace(/'/g, '\'').toLocaleString()) : '') + '</i></td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">📞 ' + (feature.properties['Kontak'] !== null ? autolinker.link(String(feature.properties['Kontak']).replace(/'/g, '\'').toLocaleString()) : '-') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">📍 ' + (feature.properties['Alamat'] !== null ? autolinker.link(String(feature.properties['Alamat']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var lat = feature.properties['Koordinat Y'] || feature.geometry.coordinates[1];
            var lng = feature.properties['Koordinat X'] || feature.geometry.coordinates[0];
            popupContent += '<button class="btn-rute" onclick="ruteKe(' + lat + ',' + lng + ')">🗺️ Rute ke sini</button>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_RumahSakit_5_0() {
            return {
                pane: 'pane_RumahSakit_5',
                rotationAngle: 0.0,
                rotationOrigin: 'center center',
                icon: L.icon({
                    iconUrl: 'markers/RumahSakit_5.svg',
                    iconSize: [14.44, 14.44]
                }),
                interactive: true,
            }
        }
        map.createPane('pane_RumahSakit_5');
        map.getPane('pane_RumahSakit_5').style.zIndex = 405;
        map.getPane('pane_RumahSakit_5').style['mix-blend-mode'] = 'normal';
        var layer_RumahSakit_5 = new L.geoJson(json_RumahSakit_5, {
            attribution: '',
            interactive: true,
            dataVar: 'json_RumahSakit_5',
            layerName: 'layer_RumahSakit_5',
            pane: 'pane_RumahSakit_5',
            onEachFeature: pop_RumahSakit_5,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.marker(latlng, style_RumahSakit_5_0(feature));
            },
        });
        bounds_group.addLayer(layer_RumahSakit_5);
        map.addLayer(layer_RumahSakit_5);
        
        var overlaysTree = [
            { label: '<img src="legend/RumahSakit_5.png" /> Rumah Sakit', layer: layer_RumahSakit_5 },
            { label: '<img src="legend/Klinik_4.png" /> Klinik', layer: layer_Klinik_4 },
            { label: '<img src="legend/AdministrasiPekanbaru_3.png" /> Administrasi Pekanbaru', layer: layer_AdministrasiPekanbaru_3 },
            { label: '<img src="legend/Jalanutama_2.png" /> Jalan-utama', layer: layer_Jalanutama_2 },
            { label: '<img src="legend/jalan_1.png" /> jalan', layer: layer_jalan_1 },
            { label: "Satelit Google", layer: layer_SatelitGoogle_0 },]
        var lay = L.control.layers.tree(null, overlaysTree, {
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
    </script>
</body>

</html>
